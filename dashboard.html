<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Statistics</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=20251019">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'JetBrains Mono', 'Consolas', 'Monaco', monospace;
            background: #000;
            color: #fff;
            min-height: 100vh;
            padding: 20px 15px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: #fff;
            font-size: 1.8em;
            margin-bottom: 5px;
            font-weight: normal;
            letter-spacing: 2px;
        }

        .subtitle {
            color: #666;
            font-size: 0.85em;
            margin-bottom: 20px;
        }

        .back-link {
            display: inline-block;
            color: #666;
            font-size: 0.85em;
            padding: 0px 10px;
            transition: all 0.2s;
            text-transform: uppercase;
            /* letter-spacing: 1px; */
        }

        .back-link:hover {
            opacity: 0.8;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #000;
            border: 1px solid #333;
            padding: 20px;
            padding-bottom: 15px;
            padding-top: 15px;
            transition: border-color 0.2s;
        }

        .stat-card:hover {
            border-color: #444;
        }

        .stat-label {
            color: #666;
            font-size: 0.75em;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            font-weight: normal;
        }

        .stat-value {
            color: #fff;
            font-size: 1.2em;
            font-weight: normal;
            line-height: 1;
        }

        .stat-change {
            color: #666;
            font-size: 0.75em;
            margin-top: 10px;
            font-weight: normal;
        }

        .chart-container {
            background: #000;
            border: 1px solid #333;
            padding: 20px;
            margin-bottom: 20px;
        }

        .chart-header {
            color: #fff;
            font-size: 0.85em;
            font-weight: normal;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #333;
        }

        canvas {
            max-height: 400px;
        }

        .update-info {
            text-align: center;
            color: #666;
            font-size: 0.75em;
            margin-top: 20px;
            padding: 12px;
            border: 1px solid #333;
            font-weight: normal;
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: #666;
        }

        .spinner {
            border: 2px solid #333;
            border-top: 2px solid #fff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #000;
            border: 1px solid #f00;
            color: #fff;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 0.85em;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.4em;
                letter-spacing: 1px;
            }

            .stats-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .stat-card {
                padding: 20px;
            }

            .stat-value {
                font-size: 0.9em;
            }

            .chart-container {
                padding: 15px;
            }

            canvas {
                max-height: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>STATISTICS DASHBOARD</h1>
            <p class="subtitle">ASCII Art API Statistics</p>
            <a href="/" class="back-link">← Back to Converter</a>
        </header>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Loading statistics...</p>
        </div>

        <div id="error" class="error" style="display: none;"></div>

        <div id="dashboard" style="display: none;">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">Total Conversions</div>
                    <div class="stat-value" id="totalConversions">0</div>
                    <div class="stat-change">All time</div>
                </div>

                <div class="stat-card">
                    <div class="stat-label">Today Conversions</div>
                    <div class="stat-value" id="todayConversions">0</div>
                    <div class="stat-change" id="todayChange">—</div>
                </div>

                <div class="stat-card">
                    <div class="stat-label">Users</div>
                    <div class="stat-value" id="uniqueUsers">0</div>
                    <div class="stat-change">Unique IP addresses</div>
                </div>

                <div class="stat-card">
                    <div class="stat-label">Average Per Day</div>
                    <div class="stat-value" id="avgPerDay">0</div>
                    <div class="stat-change" id="avgChange">Last 30 days</div>
                </div>
            </div>

            <div class="chart-container">
                <div class="chart-header">Daily Conversions (Last 30 Days)</div>
                <canvas id="dailyChart"></canvas>
            </div>

            <div class="chart-container">
                <div class="chart-header">Overall Growth</div>
                <canvas id="overallChart"></canvas>
            </div>

        </div>
    </div>

    <script>
        const API_URL = 'https://ascii.udav4ik.dev/api/stats';
        let dailyChart = null;
        let overallChart = null;
        let previousTotal = 0;
        let eventSource = null;
        let reconnectTimeout = null;

        Chart.defaults.color = '#666';
        Chart.defaults.borderColor = '#333';
        Chart.defaults.font.family = "'JetBrains Mono', 'Consolas', 'Monaco', monospace";
        Chart.defaults.font.size = 10;
        Chart.defaults.font.weight = 'normal';

        function connectSSE() {
            if (eventSource) {
                eventSource.close();
            }

            eventSource = new EventSource(API_URL);

            eventSource.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    updateDashboard(data);
                    
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('error').style.display = 'none';
                    document.getElementById('dashboard').style.display = 'block';
                } catch (error) {
                    console.error('Error parsing SSE data:', error);
                }
            };

            eventSource.onerror = function(error) {
                console.error('SSE connection error:', error);
                eventSource.close();
                showError('Connection lost. Reconnecting...');
                
                if (reconnectTimeout) {
                    clearTimeout(reconnectTimeout);
                }
                reconnectTimeout = setTimeout(() => {
                    console.log('Attempting to reconnect...');
                    connectSSE();
                }, 5000);
            };

            eventSource.onopen = function() {
                console.log('SSE connection established');
                if (reconnectTimeout) {
                    clearTimeout(reconnectTimeout);
                    reconnectTimeout = null;
                }
            };
        }

        function showError(message) {
            const errorEl = document.getElementById('error');
            errorEl.textContent = message;
            errorEl.style.display = 'block';
            document.getElementById('loading').style.display = 'none';
        }

        function updateDashboard(data) {
            document.getElementById('totalConversions').textContent = formatNumber(data.total_conversions);
            document.getElementById('todayConversions').textContent = formatNumber(data.conversions_today);
            document.getElementById('uniqueUsers').textContent = formatNumber(data.unique_users);

            const dailyBreakdown = data.daily_breakdown || [];
            const avg = dailyBreakdown.length > 0 
                ? Math.round(dailyBreakdown.reduce((sum, day) => sum + day.conversions, 0) / dailyBreakdown.length)
                : 0;
            document.getElementById('avgPerDay').textContent = formatNumber(avg);

            if (dailyBreakdown.length >= 2) {
                const today = dailyBreakdown[0].conversions;
                const yesterday = dailyBreakdown[1].conversions;
                const change = today - yesterday;
                const changePercent = yesterday > 0 ? ((change / yesterday) * 100).toFixed(1) : 0;
                const changeEl = document.getElementById('todayChange');
                
                if (change > 0) {
                    changeEl.textContent = `↑ ${change} (+${changePercent}%) from yesterday`;
                } else if (change < 0) {
                    changeEl.textContent = `↓ ${Math.abs(change)} (${changePercent}%) from yesterday`;
                } else {
                    changeEl.textContent = `→ Same as yesterday`;
                }
            }

            if (previousTotal > 0 && data.total_conversions > previousTotal) {
                const count = data.total_conversions - previousTotal;
                const label = count === 1 ? 'new conversion' : 'new conversions';
                showNotification(`+${count} ${label}`);
            }
            previousTotal = data.total_conversions;

            updateCharts(data);
        }

        function updateCharts(data) {
            const dailyBreakdown = data.daily_breakdown || [];
            
            const sortedData = [...dailyBreakdown].reverse();
            
            const labels = sortedData.map(day => {
                const date = new Date(day.date);
                return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            });
            
            const values = sortedData.map(day => day.conversions);

            if (dailyChart) {
                dailyChart.data.labels = labels;
                dailyChart.data.datasets[0].data = values;
                dailyChart.update('none');
            } else {
                const ctx = document.getElementById('dailyChart').getContext('2d');
                dailyChart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Conversions',
                            data: values,
                            backgroundColor: 'rgba(255, 255, 255, 0.8)',
                            borderColor: '#fff',
                            borderWidth: 1,
                            hoverBackgroundColor: '#fff',
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                display: false
                            },
                            tooltip: {
                                backgroundColor: '#000',
                                borderColor: '#fff',
                                borderWidth: 1,
                                titleColor: '#fff',
                                bodyColor: '#fff',
                                padding: 12,
                                displayColors: false,
                                callbacks: {
                                    label: function(context) {
                                        return `${context.parsed.y} conversions`;
                                    }
                                }
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                ticks: {
                                    precision: 0
                                },
                                grid: {
                                    color: '#222'
                                }
                            },
                            x: {
                                grid: {
                                    display: false
                                }
                            }
                        }
                    }
                });
            }

            let cumulative = 0;
            const cumulativeValues = values.map(val => {
                cumulative += val;
                return cumulative;
            });

            if (overallChart) {
                overallChart.data.labels = labels;
                overallChart.data.datasets[0].data = cumulativeValues;
                overallChart.update('none');
            } else {
                const ctx2 = document.getElementById('overallChart').getContext('2d');
                overallChart = new Chart(ctx2, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Total Conversions',
                            data: cumulativeValues,
                            borderColor: '#fff',
                            backgroundColor: 'rgba(255, 255, 255, 0.1)',
                            borderWidth: 2,
                            fill: true,
                            tension: 0.4,
                            pointRadius: 3,
                            pointHoverRadius: 5,
                            pointBackgroundColor: '#fff',
                            pointBorderColor: '#000',
                            pointBorderWidth: 2
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                display: false
                            },
                            tooltip: {
                                backgroundColor: '#000',
                                borderColor: '#fff',
                                borderWidth: 1,
                                titleColor: '#fff',
                                bodyColor: '#fff',
                                padding: 12,
                                displayColors: false,
                                callbacks: {
                                    label: function(context) {
                                        return `${context.parsed.y} total conversions`;
                                    }
                                }
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                ticks: {
                                    precision: 0
                                },
                                grid: {
                                    color: '#222'
                                }
                            },
                            x: {
                                grid: {
                                    display: false
                                }
                            }
                        }
                    }
                });
            }
        }

        function formatNumber(num) {
            return num.toLocaleString('en-US');
        }

        function showNotification(message) {
            console.log(message);
        }

        connectSSE();

        window.addEventListener('beforeunload', () => {
            if (eventSource) {
                eventSource.close();
            }
        });
    </script>
</body>
</html>
